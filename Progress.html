<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Horizontal Dashboard Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    body {
      background-color: transparent;
      padding: 12px;
      display: flex;
      justify-content: center;
      color: #37352f;
    }

    .dashboard-card {
      width: 100%;
      max-width: 920px;
      background: #ffffff;
      border: 1px solid #ededed;
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0px 1px 4px rgba(0, 0, 0, 0.04);
      position: relative;
    }

    /* Top Action Bar */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .dash-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #7a7a7a;
    }

    .settings-btn {
      background: #fbfbfa;
      border: 1px solid #e0e0e0;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: #7a7a7a;
      padding: 4px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, color 0.2s;
    }

    .settings-btn:hover {
      background: #f1f1ef;
      color: #37352f;
    }

    /* Collapsible Panel */
    .settings-panel {
      display: none;
      border-bottom: 1px solid #ededed;
      padding-bottom: 16px;
      margin-bottom: 16px;
    }

    .settings-panel.show {
      display: block;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .section-box {
      background: #fafaf9;
      border: 1px solid #f0f0ee;
      border-radius: 8px;
      padding: 12px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
    }

    .input-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      color: #7a7a7a;
    }

    input[type="date"], input[type="number"] {
      font-family: inherit;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      color: #37352f;
      outline: none;
      background: #ffffff;
      width: 100%;
    }

    input:focus {
      border-color: #2eaadc;
    }

    /* Horizontal Layout of 3 Rings */
    .rings-row {
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    .ring-card {
      flex: 1;
      min-width: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 6px 0;
    }

    .ring-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    /* SVG Rings */
    .ring-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
    }

    .ring-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: #f1f1ef;
      stroke-width: 10;
    }

    .ring-fill {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 282.74; /* 2 * PI * 45 */
      stroke-dashoffset: 282.74;
      transition: stroke-dashoffset 0.8s ease-in-out;
    }

    .ring-center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .percent-val {
      font-size: 20px;
      font-weight: 800;
      color: #37352f;
      line-height: 1;
    }

    .sub-val {
      font-size: 10px;
      font-weight: 600;
      margin-top: 3px;
      white-space: nowrap;
    }

    .status-subtext {
      font-size: 11px;
      font-weight: 600;
      color: #7a7a7a;
      margin-top: 8px;
    }

    /* Specific Theme Colors */
    .color-sem .ring-fill { stroke: #8C9AA7; }
    .color-sem .ring-title, .color-sem .sub-val { color: #8C9AA7; }

    .color-uk .ring-fill { stroke: #8C9AA7; }
    .color-uk .ring-title, .color-uk .sub-val { color: #8C9AA7; }

    .color-gpb .ring-fill { stroke: #FFDBD4; }
    .color-gpb .ring-title { color: #d97782; }
    .color-gpb .sub-val { color: #b85c67; }

    /* Remove spin arrows */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body>

  <div class="dashboard-card">
    
    <!-- Header with Toggle -->
    <div class="dashboard-header">
      <span class="dash-title">Overview Dashboard</span>
      <button class="settings-btn" id="toggleBtn" onclick="toggleSettings()">
        <span>Edit Values</span>
        <span id="arrowIcon">▼</span>
      </button>
    </div>

    <!-- Collapsible Settings Section -->
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-grid">
        
        <!-- Semester Dates -->
        <div class="section-box">
          <div class="section-title" style="color: #8C9AA7;">Semester Dates</div>
          <div class="input-row">
            <div class="input-group">
              <label>Start Date</label>
              <input type="date" id="startDate" onchange="updateSemester()">
            </div>
            <div class="input-group">
              <label>End Date</label>
              <input type="date" id="endDate" onchange="updateSemester()">
            </div>
          </div>
        </div>

        <!-- UK Invests Inputs -->
        <div class="section-box">
          <div class="section-title" style="color: #8C9AA7;">UK Invests ($)</div>
          <div class="input-row">
            <div class="input-group">
              <label>Fin. Lit ($75)</label>
              <input type="number" id="uk-fin" min="0" max="75" placeholder="0" oninput="updateUK()">
            </div>
            <div class="input-group">
              <label>Wellness ($50)</label>
              <input type="number" id="uk-well" min="0" max="50" placeholder="0" oninput="updateUK()">
            </div>
          </div>
          <div class="input-row">
            <div class="input-group">
              <label>Involve ($50)</label>
              <input type="number" id="uk-inv" min="0" max="50" placeholder="0" oninput="updateUK()">
            </div>
            <div class="input-group">
              <label>Employ ($75)</label>
              <input type="number" id="uk-emp" min="0" max="75" placeholder="0" oninput="updateUK()">
            </div>
          </div>
        </div>

        <!-- GPB Points Inputs -->
        <div class="section-box">
          <div class="section-title" style="color: #d97782;">ΓΦΒ Points</div>
          <div class="input-row">
            <div class="input-group">
              <label>Mandatory</label>
              <input type="number" id="gpb-man" min="0" placeholder="0" oninput="updateGPB()">
            </div>
            <div class="input-group">
              <label>Participate</label>
              <input type="number" id="gpb-part" min="0" placeholder="0" oninput="updateGPB()">
            </div>
            <div class="input-group">
              <label>Involvement</label>
              <input type="number" id="gpb-inv" min="0" placeholder="0" oninput="updateGPB()">
            </div>
          </div>
          <div class="input-row">
            <div class="input-group">
              <label>Networking</label>
              <input type="number" id="gpb-net" min="0" placeholder="0" oninput="updateGPB()">
            </div>
            <div class="input-group">
              <label>Kindness</label>
              <input type="number" id="gpb-kind" min="0" placeholder="0" oninput="updateGPB()">
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- 3 Side-by-Side Sleek Rings -->
    <div class="rings-row">
      
      <!-- Ring 1: Semester -->
      <div class="ring-card color-sem">
        <div class="ring-title">Semester</div>
        <div class="ring-wrapper">
          <svg class="ring-svg" viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="45"></circle>
            <circle class="ring-fill" id="semRing" cx="50" cy="50" r="45"></circle>
          </svg>
          <div class="ring-center-text">
            <span class="percent-val" id="semPercent">0%</span>
          </div>
        </div>
        <div class="status-subtext" id="semSub">0 days remaining</div>
      </div>

      <!-- Ring 2: UK Invests -->
      <div class="ring-card color-uk">
        <div class="ring-title">UK Invests</div>
        <div class="ring-wrapper">
          <svg class="ring-svg" viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="45"></circle>
            <circle class="ring-fill" id="ukRing" cx="50" cy="50" r="45"></circle>
          </svg>
          <div class="ring-center-text">
            <span class="percent-val" id="ukPercent">0%</span>
            <span class="sub-val" id="ukEarned">$0 / $250</span>
          </div>
        </div>
        <div class="status-subtext" id="ukSub">$250 remaining</div>
      </div>

      <!-- Ring 3: Gamma Phi Beta -->
      <div class="ring-card color-gpb">
        <div class="ring-title">ΓΦΒ Points</div>
        <div class="ring-wrapper">
          <svg class="ring-svg" viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="45"></circle>
            <circle class="ring-fill" id="gpbRing" cx="50" cy="50" r="45"></circle>
          </svg>
          <div class="ring-center-text">
            <span class="percent-val" id="gpbPercent">0%</span>
            <span class="sub-val" id="gpbEarned">0 / 50 pts</span>
          </div>
        </div>
        <div class="status-subtext" id="gpbSub">50 pts remaining</div>
      </div>

    </div>

  </div>

  <script>
    const CIRCUMFERENCE = 2 * Math.PI * 45; // ~282.74

    window.onload = function() {
      // Semester
      if (localStorage.getItem('semesterStart')) document.getElementById('startDate').value = localStorage.getItem('semesterStart');
      if (localStorage.getItem('semesterEnd')) document.getElementById('endDate').value = localStorage.getItem('semesterEnd');

      // UK Invests
      const savedUK = JSON.parse(localStorage.getItem('uk_invests_data') || '{}');
      if (savedUK.fin !== undefined) document.getElementById('uk-fin').value = savedUK.fin;
      if (savedUK.well !== undefined) document.getElementById('uk-well').value = savedUK.well;
      if (savedUK.inv !== undefined) document.getElementById('uk-inv').value = savedUK.inv;
      if (savedUK.emp !== undefined) document.getElementById('uk-emp').value = savedUK.emp;

      // GPB
      const savedGPB = JSON.parse(localStorage.getItem('gpb_points_data') || '{}');
      if (savedGPB.man !== undefined) document.getElementById('gpb-man').value = savedGPB.man;
      if (savedGPB.part !== undefined) document.getElementById('gpb-part').value = savedGPB.part;
      if (savedGPB.inv !== undefined) document.getElementById('gpb-inv').value = savedGPB.inv;
      if (savedGPB.net !== undefined) document.getElementById('gpb-net').value = savedGPB.net;
      if (savedGPB.kind !== undefined) document.getElementById('gpb-kind').value = savedGPB.kind;

      updateSemester();
      updateUK();
      updateGPB();
    };

    function toggleSettings() {
      const panel = document.getElementById('settingsPanel');
      const arrow = document.getElementById('arrowIcon');
      const isShown = panel.classList.toggle('show');
      arrow.innerText = isShown ? '▲' : '▼';
    }

    function setRingOffset(ringId, percent) {
      const ring = document.getElementById(ringId);
      const cappedPercent = Math.min(100, Math.max(0, percent));
      const offset = CIRCUMFERENCE - (cappedPercent / 100) * CIRCUMFERENCE;
      ring.style.strokeDasharray = CIRCUMFERENCE;
      ring.style.strokeDashoffset = offset;
    }

    // --- 1. Semester Progress Logic ---
    function updateSemester() {
      const startVal = document.getElementById('startDate').value;
      const endVal = document.getElementById('endDate').value;

      if (!startVal || !endVal) {
        document.getElementById('semPercent').innerText = '0%';
        document.getElementById('semSub').innerText = 'Set dates above';
        setRingOffset('semRing', 0);
        return;
      }

      localStorage.setItem('semesterStart', startVal);
      localStorage.setItem('semesterEnd', endVal);

      const start = new Date(startVal + 'T00:00:00').getTime();
      const end = new Date(endVal + 'T23:59:59').getTime();
      const now = Date.now();

      if (start >= end) {
        document.getElementById('semPercent').innerText = '0%';
        document.getElementById('semSub').innerText = 'Invalid dates';
        setRingOffset('semRing', 0);
        return;
      }

      if (now < start) {
        document.getElementById('semPercent').innerText = '0%';
        document.getElementById('semSub').innerText = 'Not started';
        setRingOffset('semRing', 0);
        return;
      }

      if (now > end) {
        document.getElementById('semPercent').innerText = '100%';
        document.getElementById('semSub').innerText = 'Completed! 🎉';
        setRingOffset('semRing', 100);
        return;
      }

      const total = end - start;
      const elapsed = now - start;
      const percentage = (elapsed / total) * 100;
      const daysLeft = Math.ceil((end - now) / (1000 * 60 * 60 * 24));

      document.getElementById('semPercent').innerText = Math.round(percentage) + '%';
      document.getElementById('semSub').innerText = `${daysLeft} day${daysLeft === 1 ? '' : 's'} remaining`;
      setRingOffset('semRing', percentage);
    }

    // --- 2. UK Invests Logic ---
    function parseNum(id, max) {
      const el = document.getElementById(id);
      let val = parseFloat(el.value);
      if (isNaN(val) || val < 0) return 0;
      if (max && val > max) {
        val = max;
        el.value = max;
      }
      return val;
    }

    function updateUK() {
      const fin = parseNum('uk-fin', 75);
      const well = parseNum('uk-well', 50);
      const inv = parseNum('uk-inv', 50);
      const emp = parseNum('uk-emp', 75);

      localStorage.setItem('uk_invests_data', JSON.stringify({ fin, well, inv, emp }));

      const total = fin + well + inv + emp;
      const rem = Math.max(0, 250 - total);
      const percent = Math.min(100, Math.round((total / 250) * 100));

      document.getElementById('ukPercent').innerText = percent + '%';
      document.getElementById('ukEarned').innerText = '$' + total + ' / $250';
      document.getElementById('ukSub').innerText = '$' + rem.toFixed(0) + ' remaining';
      setRingOffset('ukRing', percent);
    }

    // --- 3. GPB Points Logic ---
    function updateGPB() {
      const man = parseNum('gpb-man');
      const part = parseNum('gpb-part');
      const inv = parseNum('gpb-inv');
      const net = parseNum('gpb-net');
      const kind = parseNum('gpb-kind');

      localStorage.setItem('gpb_points_data', JSON.stringify({ man, part, inv, net, kind }));

      const total = man + part + inv + net + kind;
      const rem = Math.max(0, 50 - total);
      const percent = Math.min(100, Math.round((total / 50) * 100));

      document.getElementById('gpbPercent').innerText = percent + '%';
      document.getElementById('gpbEarned').innerText = total + ' / 50 pts';
      document.getElementById('gpbSub').innerText = rem + ' pts remaining';
      setRingOffset('gpbRing', percent);
    }
  </script>
</body>
</html>
